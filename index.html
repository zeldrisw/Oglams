<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oglams | Aprende Inglés</title>

    <link rel="stylesheet" href="styles/styles.css">

    <!-- Font Awesome para los iconos -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body id="inicio">

    <!-- =====================================================
         CONTENEDOR PRINCIPAL
    ====================================================== -->

    <main class="pagina">


        <!-- =====================================================
             HERO / INICIO
        ====================================================== -->

        <section class="hero">

            <div class="hero-logo">
                <!-- LOGO PRINCIPAL -->
                <img src="/images/logo-oglams.png" alt="Logo Oglams">
            </div>

            <div class="hero-contenido">

                <div class="hero-texto">
                    <h1>APRENDE INGLÉS</h1>

                    <span>
                        MIENTRAS TE DIVIERTES
                    </span>
                </div>

                <!--
                    AQUÍ PUEDES COLOCAR EL OSO

                    Cambia "oso.png" por el nombre real
                    de tu imagen.
                -->

                <div class="hero-oso">

                    <img
                        src="/images/oso-portada.png"
                        alt="Oso Oglams"
                    >

                </div>

            </div>

        </section>


        <!-- =====================================================
             MENÚ DE NAVEGACIÓN
        ====================================================== -->

        <nav class="menu">

            <a href="#somos" class="menu-item">
                <i class="fa-solid fa-users"></i>
                <span>Somos</span>
            </a>

            <a href="#oferta" class="menu-item">
                <i class="fa-solid fa-handshake"></i>
                <span>Oferta</span>
            </a>

            <a href="#cursos" class="menu-item">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>Cursos</span>
            </a>

            <a href="#contacto" class="menu-item">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <span>Contáctanos</span>
            </a>

        </nav>


        <!-- =====================================================
             SECCIÓN SOMOS
        ====================================================== -->

        <section id="somos" class="seccion">

            <div class="galeria">

                <!-- IMAGEN 1 -->
                <article class="foto foto-1">

                    <!--
                        CAMBIA imagen1.jpg POR TU IMAGEN
                    -->

                    <img
                        src="/images/imagen1.png"
                        alt="Aprendizaje Oglams"
                    >

                </article>


                <!-- IMAGEN 2 -->
                <article class="foto foto-2">

                    <!--
                        CAMBIA imagen2.jpg POR TU IMAGEN
                    -->

                    <img
                        src="/images/imagen2.png"
                        alt="Aprender inglés"
                    >

                </article>


                <!-- IMAGEN 3 -->
                <article class="foto foto-3">

                    <!--
                        CAMBIA imagen3.jpg POR TU IMAGEN
                    -->

                    <img
                        src="/images/imagen3.png"
                        alt="Educación Oglams"
                    >

                </article>


                <!-- IMAGEN 4 -->
                <article class="foto foto-4">

                    <!--
                        CAMBIA imagen4.jpg POR TU IMAGEN
                    -->

                    <img
                        src="/images/imagen4.png"
                        alt="Niños aprendiendo inglés"
                    >

                </article>

            </div>

        </section>


        <!-- =====================================================
             OFERTA
        ====================================================== -->

        <section id="oferta" class="oferta">

            <div class="oferta-contenido">

                <!-- OSO -->
                <div class="oferta-oso">

                    <!--
                        AQUÍ VA TU IMAGEN DEL OSO
                    -->

                    <img
                        src="/images/oso-morado.png"
                        alt="Oso Oglams"
                    >

                </div>


                <!-- NIVELES -->
                <div class="info-card niveles">

                    <i class="fa-solid fa-graduation-cap"></i>

                    <div>
                        <h2>NIVELES</h2>

                        <div class="etiquetas">
                            <span>A1</span>
                            <span>A2</span>
                        </div>
                    </div>

                </div>


                <!-- EDADES -->
                <div class="info-card edades">

                    <i class="fa-solid fa-child"></i>

                    <div>
                        <h2>EDADES</h2>

                        <span class="edad">
                            de 5 a 12 años
                        </span>
                    </div>

                </div>

            </div>

        </section>


        <!-- =====================================================
             BANNER DEL ESPACIO
        ====================================================== -->

        <section id="cursos" class="banner-espacio">

            <!--
                AQUÍ COLOCAS TU BANNER DEL ESPACIO

                Ejemplo:
                images/banner-espacio.png
            -->

            <img
                src="/images/banner-espacio.png"
                alt="El futuro del aprendizaje está aquí"
            >

        </section>


        <!-- =====================================================
             METODOLOGÍA
        ====================================================== -->

        <section class="metodologia">

            <div class="metodo-card">

                <div class="metodo-icono">
                    <i class="fa-solid fa-brain"></i>
                </div>

                <h3>
                    METODOLOGÍA<br>
                    EFECTIVA
                </h3>

            </div>


            <div class="metodo-card">

                <div class="metodo-icono">
                    <i class="fa-solid fa-book-open"></i>
                </div>

                <h3>
                    APOYO<br>
                    CONTINUO
                </h3>

            </div>


            <div class="metodo-card">

                <div class="metodo-icono">
                    <i class="fa-solid fa-bullseye"></i>
                </div>

                <h3>
                    TRABAJO<br>
                    PERSONALIZADO
                </h3>

            </div>

        </section>


        <!-- =====================================================
             CONTACTO
        ====================================================== -->

        <section id="contacto" class="contacto">

            <div class="contacto-logo">

                <!--
                    LOGO FINAL

                    Puedes utilizar el mismo logo
                    o colocar el logo final.
                -->

                <img
                    src="/images/logo-final.png"
                    alt="Oglams"
                >

            </div>


            <div class="linea"></div>


            <div class="datos-contacto">

                <div class="dato">

                    <i class="fa-brands fa-whatsapp"></i>

                    <span>
                        097 923 6897
                    </span>

                </div>


                <div class="dato">

                    <i class="fa-solid fa-location-dot"></i>

                    <span>
                        Av. Lizarzaburu y<br>
                        Miguel de Santiago
                    </span>

                </div>

            </div>

        </section>


    </main>


    <!-- =====================================================
         BOTÓN VOLVER ARRIBA
    ====================================================== -->

    <a
        href="#inicio"
        class="btn-arriba"
        title="Volver al inicio"
    >

        <i class="fa-solid fa-arrow-up"></i>

    </a>
    <footer class="site-footer">
    <div class="footer-bottom">
      <p>&copy; 2026 Nicolas Rodriguez. Todos los derechos reservados.</p>
    </div>
  </footer>

</body>

</html>
